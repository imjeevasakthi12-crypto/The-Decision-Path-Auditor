version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditorpassword
      POSTGRES_DB: audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://auditor:auditorpassword@postgres:5432/audit_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  frontend:
    build: .
    command: streamlit run frontend/Home.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  postgres_data:
